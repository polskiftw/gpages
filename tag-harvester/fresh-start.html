<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tag Gremlin Fresh Start</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:680px;margin:0 auto;padding:28px 16px;background:#111;color:#fff}button{width:100%;min-height:50px;border:0;border-radius:12px;font-size:17px;font-weight:700}code{display:block;word-break:break-all;margin-top:18px;font-size:11px;opacity:.75}</style></head><body><h1>Tag Gremlin Fresh Start</h1><p>This one-off bookmarklet erases Tag Gremlin's old v3 localStorage and v4/v5/v6 IndexedDB data for the site you run it on. It does not clear the site's cookies or log you out.</p><button id="copy">Copy Fresh Start bookmarklet</button><p id="status"></p><code id="code"></code><script>const bm="javascript:(()=>{try{localStorage.removeItem('tag-gremlin-v3:'+location.hostname)}catch{};try{indexedDB.deleteDatabase('tag-gremlin-v4:'+location.hostname)}catch{};alert('Tag Gremlin data cleared. Reload this page, then run v6.');location.reload()})()";code.textContent=bm;copy.onclick=async()=>{try{await navigator.clipboard.writeText(bm);status.textContent='Copied. Put this in a temporary Safari bookmark, run it on the target search page once, then delete that bookmark.'}catch{status.textContent='Long-press the code below and copy it.'}}</script></body></html>
