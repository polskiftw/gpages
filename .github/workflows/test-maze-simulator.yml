name: Maze Lab topology tests
on:
  push:
    paths:
      - 'maze-simulator/**'
      - '.github/workflows/test-maze-simulator.yml'
  pull_request:
    paths:
      - 'maze-simulator/**'
      - '.github/workflows/test-maze-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all floors, portals, seeds and rendered walls
        run: |
          node --check maze-simulator/app.mjs
          node --check maze-simulator/maze-core.mjs
          node --check maze-simulator/maze-grow.mjs
          node --check maze-simulator/examples.mjs
          node --test maze-simulator/tests/maze.test.mjs
          node --check maze-simulator/elevation/stairs.mjs
          node --test maze-simulator/tests/elevation.test.mjs
          node --check maze-simulator/elevation/combined.mjs
          node --check maze-simulator/elevation/choices.mjs
          node maze-simulator/elevation/choice-bench.mjs
          node --test maze-simulator/tests/combined.test.mjs
          node --test maze-simulator/tests/choices.test.mjs
          node --check maze-simulator/elevation/choice-examples.mjs
          node --test maze-simulator/tests/stair-landings.test.mjs
          node --test maze-simulator/tests/enclosed-overpasses.test.mjs
          node --check maze-simulator/walk/navigation.mjs
          node --check maze-simulator/walk/mesh.mjs
          node --check maze-simulator/walk/webgl.mjs
          node --check maze-simulator/walk/app.mjs
          node --test maze-simulator/tests/walk.test.mjs
          node --check maze-simulator/unified/app.mjs
          node --check maze-simulator/unified/examples.mjs
          node maze-simulator/elevation/bench.mjs
          node --check maze-simulator/elevation/app.mjs
          node --check maze-simulator/elevation/view.mjs
          node --check maze-simulator/elevation/examples.mjs

      - name: Export original v4 floor plans and depth metrics
        run: node maze-simulator/examples.mjs /tmp/maze-samples
      - uses: actions/upload-artifact@v4
        with:
          name: maze-math-sample-svg
          path: /tmp/maze-samples/
          retention-days: 30

      - name: Export real 3D staircase math and floor-plan SVGs
        run: |
          node maze-simulator/elevation/examples.mjs /tmp/natural-stairs
          test -s /tmp/natural-stairs/stats.json
          test -s /tmp/natural-stairs/longest-continuous-run.svg
          test -s /tmp/natural-stairs/floor-5.svg
      - uses: actions/upload-artifact@v4
        with:
          name: natural-stairs-math
          path: /tmp/natural-stairs/
          retention-days: 30

      - name: Export real baseline versus more branching layouts
        run: |
          node maze-simulator/elevation/choice-examples.mjs /tmp/maze-junction-previews
          test -s /tmp/maze-junction-previews/comparisons.json
          test -s /tmp/maze-junction-previews/choices-2-floor-0.svg
      - uses: actions/upload-artifact@v4
        with:
          name: maze-junction-choice-comparisons
          path: /tmp/maze-junction-previews/
          retention-days: 30

      - name: Export integrated Connected Detours 3D floor plans
        run: |
          node maze-simulator/unified/examples.mjs /tmp/combined-maze
          test -s /tmp/combined-maze/floor-0.svg
          test -s /tmp/combined-maze/floor-5.svg
          test -s /tmp/combined-maze/continuous-flight.svg
          test -s /tmp/combined-maze/stats.json
      - uses: actions/upload-artifact@v4
        with:
          name: connected-detours-3d-math
          path: /tmp/combined-maze/
          retention-days: 30

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CI-only browser driver
        run: |
          npm install --prefix /tmp/maze-browser --no-save --no-audit --no-fund playwright-core@1.56.1
          command -v google-chrome
      - name: Actually open and walk in 3D (headless Chrome + WebGL)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/maze-local-http.log 2>&1 &
          sleep 2
          MAZE_PLAYWRIGHT=/tmp/maze-browser/node_modules/playwright-core/index.mjs MAZE_CHROME="$(command -v google-chrome)" node maze-simulator/tests/walk-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-first-person-3d-screenshot
          path: /tmp/maze-3d-browser.png
          retention-days: 14
