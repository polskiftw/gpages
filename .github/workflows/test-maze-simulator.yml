name: Maze Lab topology tests
on:
  push:
    paths:
      - 'maze-simulator/**'
      - '.github/workflows/test-maze-simulator.yml'
  pull_request:
    paths:
      - 'maze-simulator/**'
      - '.github/workflows/test-maze-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all floors, portals, seeds and rendered walls
        run: node --test maze-simulator/tests/maze.test.mjs
