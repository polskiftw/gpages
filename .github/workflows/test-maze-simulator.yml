name: Maze Lab topology tests
on:
  push:
    paths:
      - 'maze-simulator/**'
      - '.github/workflows/test-maze-simulator.yml'
  pull_request:
    paths:
      - 'maze-simulator/**'
      - '.github/workflows/test-maze-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all floors, portals, seeds and rendered walls
        run: |
          node --check maze-simulator/app.mjs
          node --check maze-simulator/maze-core.mjs
          node --check maze-simulator/maze-grow.mjs
          node --check maze-simulator/examples.mjs
          node --test maze-simulator/tests/maze.test.mjs
          node --check maze-simulator/elevation/stairs.mjs
          node --test maze-simulator/tests/elevation.test.mjs
          node --check maze-simulator/elevation/combined.mjs
          node --test maze-simulator/tests/combined.test.mjs
          node maze-simulator/elevation/bench.mjs
          node --check maze-simulator/elevation/app.mjs
          node --check maze-simulator/elevation/view.mjs
          node --check maze-simulator/elevation/examples.mjs

      - name: Export original v4 floor plans and depth metrics
        run: node maze-simulator/examples.mjs /tmp/maze-samples
      - uses: actions/upload-artifact@v4
        with:
          name: maze-math-sample-svg
          path: /tmp/maze-samples/
          retention-days: 30

      - name: Export real 3D staircase math and floor-plan SVGs
        run: |
          node maze-simulator/elevation/examples.mjs /tmp/natural-stairs
          test -s /tmp/natural-stairs/stats.json
          test -s /tmp/natural-stairs/longest-continuous-run.svg
          test -s /tmp/natural-stairs/floor-5.svg
      - uses: actions/upload-artifact@v4
        with:
          name: natural-stairs-math
          path: /tmp/natural-stairs/
          retention-days: 30
