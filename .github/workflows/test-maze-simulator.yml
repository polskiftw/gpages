name: Maze Simulator C++ tests

on:
  push:
    paths:
      - 'maze-simulator/**'
      - '.github/workflows/test-maze-simulator.yml'
  pull_request:
    paths:
      - 'maze-simulator/**'
      - '.github/workflows/test-maze-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile all C++20 targets with warnings as errors
        shell: bash
        run: |
          cmake -S maze-simulator -B /tmp/maze-build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build /tmp/maze-build --parallel 2
      - name: Run all navigation and geometry regressions
        run: ctest --test-dir /tmp/maze-build --output-on-failure
      - name: Generate authoritative 2D mathematical maze gallery
        shell: bash
        run: |
          /tmp/maze-build/maze-preview gallery /tmp/maze-topdown-gallery
          /tmp/maze-build/maze-preview svg /tmp/maze-single-floor.svg 32 32 1 6549 600 0 0
          test -s /tmp/maze-topdown-gallery/index.html
          test -s /tmp/maze-topdown-gallery/default_floor1.svg
          test -s /tmp/maze-topdown-gallery/loopy_floor1.svg
          test -s /tmp/maze-topdown-gallery/floors_floor3.svg
          test -s /tmp/maze-single-floor.svg
          grep -Fq 'data-wall-segments=' /tmp/maze-topdown-gallery/default_floor1.svg
          grep -Fq 'const catalogue=' /tmp/maze-topdown-gallery/index.html
      - name: Upload standalone mathematical floor-plan gallery
        uses: actions/upload-artifact@v4
        with:
          name: maze-math-topdown-gallery
          path: /tmp/maze-topdown-gallery/
          retention-days: 30
      - name: Export hollow/solid and open/walled geometry combinations
        shell: bash
        run: |
          /tmp/maze-build/maze-geometry open /tmp/open-stairs.obj
          /tmp/maze-build/maze-geometry walled /tmp/walled-stairs.obj
          /tmp/maze-build/maze-geometry solid /tmp/solid-stairs.obj
          /tmp/maze-build/maze-geometry solid-walled /tmp/solid-walled-stairs.obj
          test -s /tmp/open-stairs.obj
          test -s /tmp/walled-stairs.obj
          test -s /tmp/solid-stairs.obj
          test -s /tmp/solid-walled-stairs.obj
          grep -Fxq 'g stairs_with_open_underneath' /tmp/open-stairs.obj
          grep -Fxq 'g floor_reaching_enclosure_walls' /tmp/walled-stairs.obj
          grep -Fxq 'g continuous_solid_infill' /tmp/solid-stairs.obj
          grep -Fxq 'g continuous_solid_infill' /tmp/solid-walled-stairs.obj
          grep -Fxq 'g floor_reaching_enclosure_walls' /tmp/solid-walled-stairs.obj
          ! grep -Fxq 'g continuous_solid_infill' /tmp/open-stairs.obj
          ! grep -Fxq 'g continuous_solid_infill' /tmp/walled-stairs.obj


      - name: Offer a source ZIP that needs no local Git
        uses: actions/upload-artifact@v4
        with:
          name: maze-simulator-source
          path: maze-simulator/
          retention-days: 30

  playable-linux:
    # Build SDL3 from its upstream release source on CI. The user's native
    # Gentoo build instead uses the already-installed system SDL3 package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned SDL3 3.4.16 sources
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c
          path: vendor-sdl
          persist-credentials: false
      - name: Install OpenGL software renderer and headless X server
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libxss-dev libxinerama-dev libxkbcommon-dev xvfb xauth
      - name: Compile and install CI-local SDL3 (no system modifications)
        run: |
          cmake -S vendor-sdl -B /tmp/maze-sdl-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/maze-sdl-prefix \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_WAYLAND=OFF -DSDL_X11=ON -DSDL_X11_XTEST=OFF
          cmake --build /tmp/maze-sdl-build --parallel 3
          cmake --install /tmp/maze-sdl-build
      - name: Build playable executable and geometry test with warnings as errors
        run: |
          cmake -S maze-simulator -B /tmp/maze-native-build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=/tmp/maze-sdl-prefix \
            -DMAZE_BUILD_PLAYABLE=ON -DMAZE_REQUIRE_PLAYABLE=ON \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build /tmp/maze-native-build --parallel 3 --target maze-playable playable-room-tests
          ctest --test-dir /tmp/maze-native-build -R playable-room-collision --output-on-failure
      - name: Render and compare stair and underpass perspectives under real OpenGL
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            env SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/maze-native-build/maze-playable --smoke /tmp/stair-lab.ppm
          xvfb-run -a -s "-screen 0 1280x720x24" \
            env SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/maze-native-build/maze-playable --smoke /tmp/under-hollow.ppm 1 under
          xvfb-run -a -s "-screen 0 1280x720x24" \
            env SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/maze-native-build/maze-playable --smoke /tmp/under-solid.ppm 3 under
          test -s /tmp/stair-lab.ppm
          test -s /tmp/under-hollow.ppm
          test -s /tmp/under-solid.ppm
          ! cmp -s /tmp/under-hollow.ppm /tmp/under-solid.ppm
      - name: Keep the visual smoke-test screenshots
        uses: actions/upload-artifact@v4
        with:
          name: playable-stairs-screenshot
          path: |
            /tmp/stair-lab.ppm
            /tmp/under-hollow.ppm
            /tmp/under-solid.ppm
          retention-days: 7
