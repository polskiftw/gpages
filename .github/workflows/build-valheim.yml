name: Build Valheim Mods

on:
  push:
    branches:
      - main
    paths:
      - 'valheim-ward-hit-sound/**'
      - 'valheim-hammer-everything/**'
      - 'valheim-jotunn-compat/**'
      - '.github/workflows/build-valheim.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valheim-build-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compile references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            (Join-Path $env:GITHUB_WORKSPACE 'valheim-ward-hit-sound'),
            (Join-Path $env:GITHUB_WORKSPACE 'valheim-hammer-everything'),
            (Join-Path $env:GITHUB_WORKSPACE 'valheim-jotunn-compat')
          )
          $stubDir = Join-Path $env:RUNNER_TEMP 'unity-stub'
          $valheimInstall = Join-Path $env:RUNNER_TEMP 'valheim-server'

          foreach ($project in $projects) {
            New-Item -ItemType Directory -Force -Path (Join-Path $project 'lib') | Out-Null
          }
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null

          $url = 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\bepinex.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\bepinex.zip" -DestinationPath "$env:RUNNER_TEMP\bepinex"

          $bep = Get-ChildItem -Path "$env:RUNNER_TEMP\bepinex" -Recurse -File -Filter 'BepInEx.dll' | Select-Object -First 1
          if (-not $bep) { throw 'Could not find BepInEx.dll in BepInEx pack' }

          $harmony = Get-ChildItem -Path "$env:RUNNER_TEMP\bepinex" -Recurse -File -Filter '0Harmony.dll' | Select-Object -First 1
          if (-not $harmony) { throw 'Could not find 0Harmony.dll in BepInEx pack' }

          $preloader = Get-ChildItem -Path "$env:RUNNER_TEMP\bepinex" -Recurse -File -Filter 'BepInEx.Preloader.dll' | Select-Object -First 1
          if (-not $preloader) { throw 'Could not find BepInEx.Preloader.dll in BepInEx pack' }

          $cecil = Get-ChildItem -Path "$env:RUNNER_TEMP\bepinex" -Recurse -File -Filter 'Mono.Cecil.dll' | Select-Object -First 1
          if (-not $cecil) { throw 'Could not find Mono.Cecil.dll in BepInEx pack' }

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net472</TargetFramework>
              <AssemblyName>UnityEngine</AssemblyName>
              <RootNamespace>UnityEngine</RootNamespace>
              <GenerateAssemblyInfo>true</GenerateAssemblyInfo>
              <Deterministic>true</Deterministic>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Path (Join-Path $stubDir 'UnityEngineStub.csproj') -Encoding UTF8

          @'
          namespace UnityEngine
          {
              public class Object { }
              public class Component : Object { }
              public class Behaviour : Component { }
              public class MonoBehaviour : Behaviour { }
          }
          '@ | Set-Content -Path (Join-Path $stubDir 'UnityEngineStub.cs') -Encoding UTF8

          dotnet build (Join-Path $stubDir 'UnityEngineStub.csproj') -c Release
          $unity = Join-Path $stubDir 'bin\Release\net472\UnityEngine.dll'

          foreach ($project in $projects) {
            $lib = Join-Path $project 'lib'
            Copy-Item $bep.FullName (Join-Path $lib 'BepInEx.dll')
            Copy-Item $unity (Join-Path $lib 'UnityEngine.dll')
          }

          Copy-Item $harmony.FullName (Join-Path $env:GITHUB_WORKSPACE 'valheim-hammer-everything\lib\0Harmony.dll')
          Copy-Item $harmony.FullName (Join-Path $env:GITHUB_WORKSPACE 'valheim-jotunn-compat\lib\0Harmony.dll')
          Copy-Item $preloader.FullName (Join-Path $env:GITHUB_WORKSPACE 'valheim-jotunn-compat\lib\BepInEx.Preloader.dll')
          Copy-Item $cecil.FullName (Join-Path $env:GITHUB_WORKSPACE 'valheim-jotunn-compat\lib\Mono.Cecil.dll')

          choco install steamcmd -y --no-progress
          # The Chocolatey package installs SteamCMD's bootstrap binary. Give it one
          # invocation to self-update before asking it to process app commands.
          & steamcmd +quit
          & steamcmd +@sSteamCmdForcePlatformType linux +force_install_dir $valheimInstall +login anonymous +app_info_update 1 +app_update 896660 validate +quit
          if ($LASTEXITCODE -ne 0) { throw "SteamCMD Valheim server install failed with exit code $LASTEXITCODE" }

          $serverData = Join-Path $valheimInstall 'valheim_server_Data'
          $clientData = Join-Path $valheimInstall 'Valheim_Data'
          if ((Test-Path $serverData) -and -not (Test-Path $clientData)) {
            Move-Item $serverData $clientData
          }
          if (-not (Test-Path (Join-Path $clientData 'Managed\Assembly-CSharp.dll'))) {
            throw 'Valheim managed assemblies were not installed as expected'
          }

          $vhCore = Join-Path $valheimInstall 'BepInEx\core'
          New-Item -ItemType Directory -Force -Path $vhCore | Out-Null
          Copy-Item $bep.FullName (Join-Path $vhCore 'BepInEx.dll')
          Copy-Item $harmony.FullName (Join-Path $vhCore '0Harmony.dll')
          Copy-Item $cecil.FullName (Join-Path $vhCore 'Mono.Cecil.dll')
          "VALHEIM_INSTALL=$valheimInstall" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enforce generic Jotunn runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoots = @(
            '.\valheim-jotunn-compat\src\JotunnCompat.Runtime',
            '.\valheim-jotunn-compat\src\JotunnCompat.Preloader',
            '.\valheim-jotunn-compat\src\JotunnCompat.Slim'
          )
          $forbidden = @(
            'MoreWorldLocations',
            'More_World_Locations',
            'warpalicious.More_World_Locations',
            'jneb802'
          )

          foreach ($needle in $forbidden) {
            foreach ($runtimeRoot in $runtimeRoots) {
              $matches = Get-ChildItem $runtimeRoot -Recurse -File -Filter '*.cs' |
                Select-String -SimpleMatch $needle
              if ($matches) {
                $matches | ForEach-Object { Write-Host $_.ToString() }
                throw "Target-specific identifier '$needle' is forbidden in Jotunn runtime code."
              }
            }
          }

          Write-Host 'Generic Jotunn runtime invariant passed.'

      - name: Audit Hammer Everything recipe coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourcePath = '.\valheim-hammer-everything\HammerEverything.cs'
          $auditPath = '.\valheim-hammer-everything\recipe-audit.txt'

          $source = Get-Content $sourcePath -Raw
          $audit = @(
            Get-Content $auditPath |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith('#') }
          )

          $match = [regex]::Match(
            $source,
            '(?s)private static readonly Dictionary<string, RecipeIngredient\[\]> CuratedRecipes\s*=\s*new Dictionary<string, RecipeIngredient\[\]>\(StringComparer\.OrdinalIgnoreCase\)\s*\{(?<body>.*?)\n\s*\};'
          )
          if (-not $match.Success) {
            throw 'Could not locate CuratedRecipes dictionary for audit.'
          }

          $recipeNames = @(
            [regex]::Matches($match.Groups['body'].Value, '\{\s*"([^"]+)"\s*,\s*Recipe\(') |
              ForEach-Object { $_.Groups[1].Value }
          )

          $duplicates = @(
            $recipeNames |
              Group-Object |
              Where-Object Count -gt 1 |
              ForEach-Object Name
          )
          if ($duplicates.Count -gt 0) {
            throw "Duplicate curated recipe key(s): $($duplicates -join ', ')"
          }

          $missing = @($audit | Where-Object { $recipeNames -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "Audited prefab(s) missing curated recipes: $($missing -join ', ')"
          }

          Write-Host "Recipe audit passed: $($audit.Count) audited hidden prefabs, $($recipeNames.Count) curated recipe keys."

      - name: Build Ward Hit Sound Toggle
        shell: pwsh
        run: dotnet build .\valheim-ward-hit-sound\WardHitSoundToggle.csproj -c Release

      - name: Build Hammer Everything
        shell: pwsh
        run: dotnet build .\valheim-hammer-everything\HammerEverything.csproj -c Release

      - name: Build Jotunn compatibility tooling
        shell: pwsh
        run: |
          dotnet build .\valheim-jotunn-compat\src\JotunnCompat.Preloader\JotunnCompat.Preloader.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\valheim-jotunn-compat\src\JotunnCompat.ContractCheck\JotunnCompat.ContractCheck.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\valheim-jotunn-compat\src\JotunnCompat.CompatibilityProbe\JotunnCompat.CompatibilityProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build slim Jotunn runtime
        shell: pwsh
        run: |
          dotnet build .\valheim-jotunn-compat\src\JotunnCompat.Slim\JotunnCompat.Slim.csproj -c Release /p:ValheimInstall="$env:VALHEIM_INSTALL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Jotunn compatibility package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $slim = Join-Path $env:GITHUB_WORKSPACE 'valheim-jotunn-compat\src\JotunnCompat.Slim\bin\Release\net472\Jotunn.dll'
          $yaml = Join-Path $env:GITHUB_WORKSPACE 'valheim-jotunn-compat\src\JotunnCompat.Slim\bin\Release\net472\YamlDotNet.dll'
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'valheim-jotunn-compat\bin\Release\package'
          $packageZip = Join-Path $env:GITHUB_WORKSPACE 'valheim-jotunn-compat\bin\Release\JotunnCompat.zip'

          if (-not (Test-Path $slim)) { throw "Slim Jotunn build output missing: $slim" }

          # First compatibility canary. Target-specific knowledge lives only in CI/tests;
          # production runtime code remains completely generic.
          $mwlVersion = '5.1.1'
          $mwlUrl = "https://thunderstore.io/package/download/warpalicious/More_World_Locations_AIO/$mwlVersion/"
          $mwlZip = Join-Path $env:RUNNER_TEMP "More_World_Locations_AIO-$mwlVersion.zip"
          $mwlExtract = Join-Path $env:RUNNER_TEMP "More_World_Locations_AIO-$mwlVersion"
          Invoke-WebRequest -Uri $mwlUrl -OutFile $mwlZip
          Expand-Archive -Path $mwlZip -DestinationPath $mwlExtract

          $mwlDll = Get-ChildItem -Path $mwlExtract -Recurse -File -Filter 'More_World_Locations_AIO.dll' | Select-Object -First 1
          if (-not $mwlDll) { throw "Could not find More_World_Locations_AIO.dll in canary package $mwlVersion" }

          $compatProbe = Join-Path $env:GITHUB_WORKSPACE 'valheim-jotunn-compat\src\JotunnCompat.CompatibilityProbe\bin\Release\net8.0\JotunnCompat.CompatibilityProbe.dll'
          dotnet $compatProbe $slim $mwlDll.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $pluginDir = Join-Path $packageDir 'BepInEx\plugins\JotunnCompat'
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null

          Copy-Item -Force $slim (Join-Path $pluginDir 'Jotunn.dll')
          if (Test-Path $yaml) { Copy-Item -Force $yaml (Join-Path $pluginDir 'YamlDotNet.dll') }
          Copy-Item -Force '.\valheim-jotunn-compat\LICENSE' (Join-Path $packageDir 'LICENSE')
          Copy-Item -Force '.\valheim-jotunn-compat\README.md' (Join-Path $packageDir 'README.md')

          if (Test-Path $packageZip) { Remove-Item $packageZip -Force }
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $packageZip -CompressionLevel Optimal

      - name: Verify build outputs
        shell: pwsh
        run: |
          $files = @(
            '.\valheim-ward-hit-sound\bin\Release\net472\WardHitSoundToggle.dll',
            '.\valheim-hammer-everything\bin\Release\net472\HammerEverything.dll',
            '.\valheim-jotunn-compat\bin\Release\package\BepInEx\plugins\JotunnCompat\Jotunn.dll',
            '.\valheim-jotunn-compat\bin\Release\JotunnCompat.zip'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Build output missing: $file" }
            Get-FileHash $file -Algorithm SHA256
          }

      - name: Publish Valheim artifacts to gpages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          New-Item -ItemType Directory -Force -Path '.\valheim\jotunn-compat' | Out-Null

          Copy-Item -Force '.\valheim-ward-hit-sound\bin\Release\net472\WardHitSoundToggle.dll' '.\valheim\ward-hit-sound\WardHitSoundToggle.dll'
          Copy-Item -Force '.\valheim-hammer-everything\bin\Release\net472\HammerEverything.dll' '.\valheim\hammer-everything\HammerEverything.dll'
          Copy-Item -Force '.\valheim-jotunn-compat\bin\Release\package\BepInEx\plugins\JotunnCompat\Jotunn.dll' '.\valheim\jotunn-compat\Jotunn.dll'
          git rm -f --ignore-unmatch "valheim/jotunn-compat/JotunnCompat.Preloader.dll"
          Copy-Item -Force '.\valheim-jotunn-compat\bin\Release\JotunnCompat.zip' '.\valheim\jotunn-compat\JotunnCompat.zip'

          git rm -f --ignore-unmatch "valheim/jotunn-compat/JotunnCompat.FastPath.dll"
          git add -- "valheim/ward-hit-sound/WardHitSoundToggle.dll" "valheim/hammer-everything/HammerEverything.dll" "valheim/jotunn-compat/Jotunn.dll" "valheim/jotunn-compat/JotunnCompat.zip"

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Published Valheim artifacts are already current.'
            exit 0
          }

          git commit -m "Publish Valheim mod artifacts"
          git push
