name: GDupe Windows

on:
  push:
    branches: [main, feature/gdupe-desktop]
    paths:
      - "gdupe/**"
      - ".github/workflows/gdupe-windows.yml"
      - "LICENSE"
  pull_request:
    paths:
      - "gdupe/**"
      - ".github/workflows/gdupe-windows.yml"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: gdupe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify Release build and tests
        run: ./build/verify.ps1
      - name: Build distributable ZIP
        run: ./build/package.ps1
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: GDupe-win-x64
          path: gdupe/artifacts/GDupe-win-x64.zip
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GDupe-test-results
          path: gdupe/**/TestResults/**
          if-no-files-found: ignore
