name: Tag Gremlin period-prevalence sweep

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  period-prevalence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        keep: ['0', '0.0025', '0.005', '0.01', '0.025', '0.05', '0.10', '0.25', '0.50', '1.0']
    steps:
      - uses: actions/checkout@v4
      - name: Build grammar-corrected period-only simulator
        working-directory: research/tag-gremlin-v10
        run: python3 period_only_sim.py --src native_sim.cpp --out native_sim_period_only.cpp
      - name: Compile focused period probe
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 punctuation_probe.cpp -o period_probe
      - name: Generate prevalence-controlled balanced world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n 10000 --seed 83001 --archetype balanced --boundary-keep ${{ matrix.keep }} --out world.tsv
      - name: Measure prevalence and depth-2 value
        working-directory: research/tag-gremlin-v10
        run: |
          python3 - <<'PY' | tee prevalence-${{ matrix.keep }}.txt
          from pathlib import Path
          tags=[line.split('\t',1)[1] for line in Path('world.tsv').read_text().splitlines()]
          assert all('-' not in t and not t.startswith('.') and not t.endswith('.') and '..' not in t and all(t.split('.')) for t in tags)
          bearing=sum('.' in t for t in tags)
          periods=sum(t.count('.') for t in tags)
          print(f'PREVALENCE keep=${{ matrix.keep }} period_tags={bearing} periods={periods} fraction={bearing/len(tags):.6f}')
          PY
          ./period_probe world.tsv 2 | tee -a prevalence-${{ matrix.keep }}.txt
      - name: Upload prevalence result
        uses: actions/upload-artifact@v4
        with:
          name: period-prevalence-${{ matrix.keep }}
          path: research/tag-gremlin-v10/prevalence-${{ matrix.keep }}.txt
          if-no-files-found: error
