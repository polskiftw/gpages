name: Tag Gremlin period-child ablation

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  child-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   n: 10000, seed: 81001 }
          - { archetype: linguistic, n: 10000, seed: 81101 }
          - { archetype: names,      n: 10000, seed: 81201 }
          - { archetype: weird,      n: 10000, seed: 81301 }
          - { archetype: shortheavy, n: 10000, seed: 81401 }
          - { archetype: compound,   n: 10000, seed: 81501 }
    steps:
      - uses: actions/checkout@v4
      - name: Build period-only simulator source
        working-directory: research/tag-gremlin-v10
        run: python3 period_only_sim.py --src native_sim.cpp --out native_sim_period_only.cpp
      - name: Compile child ablation probe
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 period_child_ablation.cpp -o period_child_ablation
      - name: Generate period-only training world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n ${{ matrix.n }} --seed ${{ matrix.seed }} --archetype ${{ matrix.archetype }} --out world.tsv
      - name: Assert site alphabet
        working-directory: research/tag-gremlin-v10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for line in Path('world.tsv').read_text().splitlines():
              tag=line.split('\t',1)[1]
              assert '-' not in tag
              assert all(c.islower() or c.isdigit() or c=='.' for c in tag)
          PY
      - name: Measure period-child marginals
        working-directory: research/tag-gremlin-v10
        run: ./period_child_ablation world.tsv | tee ablation-${{ matrix.archetype }}-${{ matrix.seed }}.txt
      - name: Upload ablation result
        uses: actions/upload-artifact@v4
        with:
          name: period-ablation-${{ matrix.archetype }}-${{ matrix.seed }}
          path: research/tag-gremlin-v10/ablation-${{ matrix.archetype }}-${{ matrix.seed }}.txt
          if-no-files-found: error
