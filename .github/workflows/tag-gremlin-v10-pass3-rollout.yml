name: Tag Gremlin grammar-corrected period-child ablation

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-child-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   n: 10000, seed: 82001 }
          - { archetype: linguistic, n: 10000, seed: 82101 }
          - { archetype: names,      n: 10000, seed: 82201 }
          - { archetype: weird,      n: 10000, seed: 82301 }
          - { archetype: shortheavy, n: 10000, seed: 82401 }
          - { archetype: compound,   n: 10000, seed: 82501 }
    steps:
      - uses: actions/checkout@v4
      - name: Build grammar-corrected period-only simulator
        working-directory: research/tag-gremlin-v10
        run: python3 period_only_sim.py --src native_sim.cpp --out native_sim_period_only.cpp
      - name: Compile period-child ablation
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 period_child_ablation.cpp -o period_child_ablation
      - name: Generate semantic period-boundary world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n ${{ matrix.n }} --seed ${{ matrix.seed }} --archetype ${{ matrix.archetype }} --out world.tsv
      - name: Assert site grammar
        working-directory: research/tag-gremlin-v10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for line in Path('world.tsv').read_text().splitlines():
              tag=line.split('\t',1)[1]
              assert '-' not in tag
              assert all(c.islower() or c.isdigit() or c=='.' for c in tag)
              assert not tag.startswith('.') and not tag.endswith('.')
              assert '..' not in tag
              assert all(tag.split('.'))
          PY
      - name: Measure legal period-child marginals
        working-directory: research/tag-gremlin-v10
        run: ./period_child_ablation world.tsv | tee grammar-ablation-${{ matrix.archetype }}-${{ matrix.seed }}.txt
      - name: Upload grammar-corrected ablation
        uses: actions/upload-artifact@v4
        with:
          name: grammar-ablation-${{ matrix.archetype }}-${{ matrix.seed }}
          path: research/tag-gremlin-v10/grammar-ablation-${{ matrix.archetype }}-${{ matrix.seed }}.txt
          if-no-files-found: error
