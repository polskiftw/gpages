name: Tag Gremlin v10 Pass 3 rollouts

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   n: 10000, seed: 73001 }
          - { archetype: balanced,   n: 10000, seed: 73002 }
          - { archetype: linguistic, n: 10000, seed: 73101 }
          - { archetype: linguistic, n: 10000, seed: 73102 }
          - { archetype: names,      n: 10000, seed: 73201 }
          - { archetype: names,      n: 10000, seed: 73202 }
          - { archetype: weird,      n: 10000, seed: 73301 }
          - { archetype: weird,      n: 10000, seed: 73302 }
          - { archetype: shortheavy, n: 10000, seed: 73401 }
          - { archetype: shortheavy, n: 10000, seed: 73402 }
          - { archetype: compound,   n: 10000, seed: 73501 }
          - { archetype: compound,   n: 10000, seed: 73502 }
    steps:
      - uses: actions/checkout@v4
      - name: Compile adaptive validation probe
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 adaptive_mix_probe.cpp -o adaptive_mix_probe
      - name: Generate fresh corrected holdout world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n ${{ matrix.n }} --seed ${{ matrix.seed }} --archetype ${{ matrix.archetype }} --out world.tsv
      - name: Compare learned-prune against adaptive controllers
        working-directory: research/tag-gremlin-v10
        run: ./adaptive_mix_probe world.tsv | tee adaptive-${{ matrix.archetype }}-${{ matrix.seed }}.txt
      - name: Upload holdout result
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-${{ matrix.archetype }}-${{ matrix.seed }}
          path: research/tag-gremlin-v10/adaptive-${{ matrix.archetype }}-${{ matrix.seed }}.txt
          if-no-files-found: error
