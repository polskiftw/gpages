name: Tag Gremlin calibrated 330k boundary-depth model

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-scale-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   seed: 86000 }
          - { archetype: linguistic, seed: 86100 }
          - { archetype: names,      seed: 86200 }
          - { archetype: weird,      seed: 86300 }
          - { archetype: shortheavy, seed: 86400 }
          - { archetype: compound,   seed: 86500 }
    steps:
      - uses: actions/checkout@v4
      - name: Model 330k period boundary trie from 33 independent 10k shards
        working-directory: research/tag-gremlin-v10
        run: >-
          python3 period_real_scale_model.py
          --archetype ${{ matrix.archetype }}
          --shards 33
          --shard-n 10000
          --seed-base ${{ matrix.seed }}
          --target-total 330000
          --target-dotted 229000
          --max-after 3
          | tee real-scale-${{ matrix.archetype }}.txt
      - name: Upload calibrated scale model
        uses: actions/upload-artifact@v4
        with:
          name: real-scale-period-${{ matrix.archetype }}
          path: research/tag-gremlin-v10/real-scale-${{ matrix.archetype }}.txt
          if-no-files-found: error
