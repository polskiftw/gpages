name: Tag Gremlin direct period coverage and unique-scale proof

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: balanced-10k, archetype: balanced, n: 10000, seed: 87001 }
          - { label: weird-10k, archetype: weird, n: 10000, seed: 87301 }
          - { label: balanced-30k, archetype: balanced, n: 30000, seed: 88001 }
          - { label: compound-30k, archetype: compound, n: 30000, seed: 88501 }
          - { label: weird-30k, archetype: weird, n: 30000, seed: 88301 }
    steps:
      - uses: actions/checkout@v4
      - name: Build grammar-corrected period-only simulator
        working-directory: research/tag-gremlin-v10
        run: python3 period_only_sim.py --src native_sim.cpp --out native_sim_period_only.cpp
      - name: Compile direct period coverage oracle
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 period_coverage_oracle.cpp -o period_coverage_oracle
      - name: Generate semantic period world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n ${{ matrix.n }} --seed ${{ matrix.seed }} --archetype ${{ matrix.archetype }} --out world.tsv
      - name: Measure exact old-proof coverage of direct period substrings
        working-directory: research/tag-gremlin-v10
        run: ./period_coverage_oracle world.tsv 4 | tee coverage-${{ matrix.label }}.txt
      - name: Upload coverage result
        uses: actions/upload-artifact@v4
        with:
          name: direct-period-coverage-${{ matrix.label }}
          path: research/tag-gremlin-v10/coverage-${{ matrix.label }}.txt
          if-no-files-found: error

  unique-scale-model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced, seed: 89000 }
          - { archetype: linguistic, seed: 89100 }
          - { archetype: names, seed: 89200 }
          - { archetype: weird, seed: 89300 }
          - { archetype: shortheavy, seed: 89400 }
          - { archetype: compound, seed: 89500 }
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-quota unique 330k vocabulary model
        working-directory: research/tag-gremlin-v10
        run: >-
          python3 period_unique_scale_model.py
          --archetype ${{ matrix.archetype }}
          --seed-base ${{ matrix.seed }}
          --shard-n 10000
          --target-total 330000
          --target-dotted 229000
          --max-shards 250
          --max-after 3
          | tee unique-scale-${{ matrix.archetype }}.txt
      - name: Upload unique-scale result
        uses: actions/upload-artifact@v4
        with:
          name: unique-period-scale-${{ matrix.archetype }}
          path: research/tag-gremlin-v10/unique-scale-${{ matrix.archetype }}.txt
          if-no-files-found: error
