name: Tag Gremlin sparse period certificate probe

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse-period:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   n: 10000, seed: 82001 }
          - { archetype: linguistic, n: 10000, seed: 82101 }
          - { archetype: names,      n: 10000, seed: 82201 }
          - { archetype: weird,      n: 10000, seed: 82301 }
          - { archetype: shortheavy, n: 10000, seed: 82401 }
          - { archetype: compound,   n: 10000, seed: 82501 }
    steps:
      - uses: actions/checkout@v4
      - name: Build grammar-corrected simulator
        working-directory: research/tag-gremlin-v10
        run: python3 period_only_sim.py --src native_sim.cpp --out native_sim_period_only.cpp
      - name: Compile sparse certificate probe
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 period_sparse_cert_probe.cpp -o period_sparse_cert_probe
      - name: Generate semantic boundary world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n ${{ matrix.n }} --seed ${{ matrix.seed }} --archetype ${{ matrix.archetype }} --out world.tsv
      - name: Compare sparse word-start certificates
        working-directory: research/tag-gremlin-v10
        run: ./period_sparse_cert_probe world.tsv | tee sparse-${{ matrix.archetype }}-${{ matrix.seed }}.txt
      - name: Upload sparse result
        uses: actions/upload-artifact@v4
        with:
          name: sparse-period-${{ matrix.archetype }}-${{ matrix.seed }}
          path: research/tag-gremlin-v10/sparse-${{ matrix.archetype }}-${{ matrix.seed }}.txt
          if-no-files-found: error
