name: Tag Gremlin v10 punctuation architecture probe

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  punctuation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   n: 10000, seed: 80001 }
          - { archetype: linguistic, n: 10000, seed: 80101 }
          - { archetype: names,      n: 10000, seed: 80201 }
          - { archetype: weird,      n: 10000, seed: 80301 }
          - { archetype: shortheavy, n: 10000, seed: 80401 }
          - { archetype: compound,   n: 10000, seed: 80501 }
    steps:
      - uses: actions/checkout@v4
      - name: Compile punctuation-start probe
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 punctuation_probe.cpp -o punctuation_probe
      - name: Generate fresh corrected world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n ${{ matrix.n }} --seed ${{ matrix.seed }} --archetype ${{ matrix.archetype }} --out world.tsv
      - name: Compare optional punctuation-start probe depths
        working-directory: research/tag-gremlin-v10
        run: ./punctuation_probe world.tsv | tee punct-${{ matrix.archetype }}-${{ matrix.seed }}.txt
      - name: Upload punctuation result
        uses: actions/upload-artifact@v4
        with:
          name: punct-${{ matrix.archetype }}-${{ matrix.seed }}
          path: research/tag-gremlin-v10/punct-${{ matrix.archetype }}-${{ matrix.seed }}.txt
          if-no-files-found: error
