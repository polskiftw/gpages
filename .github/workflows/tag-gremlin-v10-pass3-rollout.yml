name: Tag Gremlin v10 Pass 3 rollouts

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  defer-known:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   n: 10000, seed: 77001 }
          - { archetype: linguistic, n: 10000, seed: 77101 }
          - { archetype: names,      n: 10000, seed: 77201 }
          - { archetype: weird,      n: 10000, seed: 77301 }
          - { archetype: shortheavy, n: 10000, seed: 77401 }
          - { archetype: compound,   n: 10000, seed: 77501 }
    steps:
      - uses: actions/checkout@v4
      - name: Compile safe deferral probe
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 defer_known_probe.cpp -o defer_known_probe
      - name: Generate fresh corrected 10k world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n ${{ matrix.n }} --seed ${{ matrix.seed }} --archetype ${{ matrix.archetype }} --out world.tsv
      - name: Compare near-inference deferral thresholds
        working-directory: research/tag-gremlin-v10
        run: ./defer_known_probe world.tsv | tee defer-${{ matrix.archetype }}-${{ matrix.seed }}.txt
      - name: Upload deferral result
        uses: actions/upload-artifact@v4
        with:
          name: defer-${{ matrix.archetype }}-${{ matrix.seed }}
          path: research/tag-gremlin-v10/defer-${{ matrix.archetype }}-${{ matrix.seed }}.txt
          if-no-files-found: error
