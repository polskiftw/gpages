name: Tag Gremlin v10 Pass 3 rollouts

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-ceiling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   n: 10000, seed: 75001 }
          - { archetype: linguistic, n: 10000, seed: 75101 }
          - { archetype: names,      n: 10000, seed: 75201 }
          - { archetype: weird,      n: 10000, seed: 75301 }
          - { archetype: shortheavy, n: 10000, seed: 75401 }
          - { archetype: compound,   n: 10000, seed: 75501 }
    steps:
      - uses: actions/checkout@v4
      - name: Compile hidden-outcome ranking probe
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 oracle_ceiling.cpp -o oracle_ceiling
      - name: Generate fresh corrected 10k world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n ${{ matrix.n }} --seed ${{ matrix.seed }} --archetype ${{ matrix.archetype }} --out world.tsv
      - name: Compare runtime rankers with hidden-outcome rankers
        working-directory: research/tag-gremlin-v10
        run: ./oracle_ceiling world.tsv | tee oracle-${{ matrix.archetype }}-${{ matrix.seed }}.txt
      - name: Upload oracle result
        uses: actions/upload-artifact@v4
        with:
          name: oracle-${{ matrix.archetype }}-${{ matrix.seed }}
          path: research/tag-gremlin-v10/oracle-${{ matrix.archetype }}-${{ matrix.seed }}.txt
          if-no-files-found: error
