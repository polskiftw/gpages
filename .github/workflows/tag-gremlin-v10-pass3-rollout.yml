name: Tag Gremlin adaptive period pilot sweep

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-period:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        keep: ['0', '0.0025', '0.005', '0.01', '0.025', '0.05', '0.10', '0.25', '0.50', '1.0']
    steps:
      - uses: actions/checkout@v4
      - name: Build grammar-corrected period-only simulator
        working-directory: research/tag-gremlin-v10
        run: python3 period_only_sim.py --src native_sim.cpp --out native_sim_period_only.cpp
      - name: Compile adaptive period pilot
        working-directory: research/tag-gremlin-v10
        run: g++ -O3 -std=c++20 -march=x86-64-v3 period_adaptive_probe.cpp -o period_adaptive_probe
      - name: Generate prevalence-controlled balanced world
        working-directory: research/tag-gremlin-v10
        run: python3 worldgen.py --n 10000 --seed 83001 --archetype balanced --boundary-keep ${{ matrix.keep }} --out world.tsv
      - name: Compare runtime-observable adaptive policies
        working-directory: research/tag-gremlin-v10
        run: |
          python3 - <<'PY' | tee adaptive-${{ matrix.keep }}.txt
          from pathlib import Path
          tags=[line.split('\t',1)[1] for line in Path('world.tsv').read_text().splitlines()]
          bearing=sum('.' in t for t in tags)
          periods=sum(t.count('.') for t in tags)
          print(f'PREVALENCE keep=${{ matrix.keep }} period_tags={bearing} periods={periods} fraction={bearing/len(tags):.6f}')
          PY
          ./period_adaptive_probe world.tsv | tee -a adaptive-${{ matrix.keep }}.txt
      - name: Upload adaptive result
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-period-${{ matrix.keep }}
          path: research/tag-gremlin-v10/adaptive-${{ matrix.keep }}.txt
          if-no-files-found: error
