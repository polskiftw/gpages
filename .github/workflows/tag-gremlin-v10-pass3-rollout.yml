name: Tag Gremlin real-scale period structure probe

on:
  pull_request:
    paths:
      - 'research/tag-gremlin-v10/**'
      - '.github/workflows/tag-gremlin-v10-pass3-rollout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same balanced family at increasing vocabulary sizes to expose the
          # point where rare post-period initials cross K=40 saturation.
          - { label: balanced-10k,  archetype: balanced,   n: 10000,  seed: 85001 }
          - { label: balanced-30k,  archetype: balanced,   n: 30000,  seed: 85001 }
          - { label: balanced-100k, archetype: balanced,   n: 100000, seed: 85001 }
          - { label: balanced-330k, archetype: balanced,   n: 330000, seed: 85001 }

          # Real-site vocabulary scale across all spelling archetypes.  These
          # jobs generate spellings only: score/reachability work is omitted
          # because it cannot change whether `.x` contains <40 or >=40 tags.
          - { label: linguistic-330k, archetype: linguistic, n: 330000, seed: 85101 }
          - { label: names-330k,      archetype: names,      n: 330000, seed: 85201 }
          - { label: weird-330k,      archetype: weird,      n: 330000, seed: 85301 }
          - { label: shortheavy-330k, archetype: shortheavy, n: 330000, seed: 85401 }
          - { label: compound-330k,   archetype: compound,   n: 330000, seed: 85501 }
    steps:
      - uses: actions/checkout@v4
      - name: Measure period boundary buckets at scale
        working-directory: research/tag-gremlin-v10
        run: >-
          python3 period_scale_probe.py
          --n ${{ matrix.n }}
          --seed ${{ matrix.seed }}
          --archetype ${{ matrix.archetype }}
          | tee scale-${{ matrix.label }}.txt
      - name: Upload scale result
        uses: actions/upload-artifact@v4
        with:
          name: period-scale-${{ matrix.label }}
          path: research/tag-gremlin-v10/scale-${{ matrix.label }}.txt
          if-no-files-found: error
