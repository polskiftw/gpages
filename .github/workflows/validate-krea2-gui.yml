name: Validate Krea2 GUI

on:
  push:
    paths:
      - "krea2-gui/**"
      - ".github/workflows/validate-krea2-gui.yml"
  pull_request:
    paths:
      - "krea2-gui/**"
      - ".github/workflows/validate-krea2-gui.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: |
          python3 -m py_compile krea2-gui/krea2_gui.py krea2-gui/krea2_anypaint.py
      - name: Check shell syntax
        run: |
          sh -n krea2-gui/install-user.sh krea2-gui/setup-anypaint.sh
