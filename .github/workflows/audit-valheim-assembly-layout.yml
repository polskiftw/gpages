name: Audit Valheim Assembly Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-valheim-assembly-layout.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ILSpy CLI
        shell: pwsh
        run: dotnet tool install --global ilspycmd

      - name: Download current Valheim debug draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/398304259" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'ValheimDebug.tar.gz' } | Select-Object -First 1
          if (-not $asset) { throw 'ValheimDebug.tar.gz missing' }
          $downloadHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Uri $asset.url -Headers $downloadHeaders -OutFile ValheimDebug.tar.gz
          New-Item -ItemType Directory -Force debug | Out-Null
          tar -xzf ValheimDebug.tar.gz -C debug
          if ($LASTEXITCODE -ne 0) { throw 'extract failed' }

      - name: Inspect gameplay assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $managed = Get-ChildItem debug -Recurse -Directory | Where-Object { $_.Name -eq 'Managed' } | Select-Object -First 1
          if (-not $managed) { throw 'Managed directory missing' }
          Write-Host "Managed: $($managed.FullName)"

          foreach ($name in @('assembly_valheim.dll','Assembly-CSharp.dll')) {
            $dll = Join-Path $managed.FullName $name
            if (-not (Test-Path $dll)) {
              Write-Host "MISSING: $name"
              continue
            }

            $info = Get-Item $dll
            Write-Host ""
            Write-Host "===== $name ====="
            Write-Host "Size: $($info.Length)"
            $an = [System.Reflection.AssemblyName]::GetAssemblyName($dll)
            Write-Host "AssemblyName: $($an.FullName)"

            $list = & ilspycmd -l c $dll 2>&1
            Write-Host "--- ItemDrop / ItemData types ---"
            $list | Where-Object { $_ -match 'ItemDrop|ItemData' } | ForEach-Object { Write-Host $_ }
            Write-Host "--- first 30 types ---"
            $list | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
          }
