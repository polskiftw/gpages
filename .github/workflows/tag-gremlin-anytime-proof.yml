name: Tag Gremlin anytime proof witness

on:
  push:
    branches:
      - research/tag-gremlin-anytime-impossibility
  pull_request:
    paths:
      - 'research/tag-gremlin-anytime/**'
      - '.github/workflows/tag-gremlin-anytime-proof.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exhaustive finite witness
        run: python research/tag-gremlin-anytime/verify_counterexample.py
