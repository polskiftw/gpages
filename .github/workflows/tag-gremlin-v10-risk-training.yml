name: Tag Gremlin risk-aware direct certificate training

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'research/tag-gremlin-v10/period_risk_certificate.cpp'
      - '.github/workflows/tag-gremlin-v10-risk-training.yml'

permissions:
  contents: read

jobs:
  risk-training-10k:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   seed: 96001 }
          - { archetype: linguistic, seed: 96101 }
          - { archetype: names,      seed: 96201 }
          - { archetype: weird,      seed: 96301 }
          - { archetype: shortheavy, seed: 96401 }
          - { archetype: compound,   seed: 96501 }
    defaults:
      run:
        working-directory: research/tag-gremlin-v10
    steps:
      - uses: actions/checkout@v4

      - name: Build grammar-corrected period-only simulator
        run: python3 period_only_sim.py --src native_sim.cpp --out native_sim_period_only.cpp

      - name: Compile risk-aware direct-certificate harness
        run: g++ -O3 -std=c++20 -march=x86-64-v3 period_risk_certificate.cpp -o period_risk_certificate

      - name: Generate exact-prevalence 10k training world
        run: |
          set -euo pipefail
          python3 period_quota_worldgen.py \
            --target-total 10000 \
            --target-dotted 6939 \
            --seed-base ${{ matrix.seed }} \
            --archetype ${{ matrix.archetype }} \
            --shard-n 10000 \
            --max-shards 80 \
            --out world.tsv | tee risk-world-${{ matrix.archetype }}.txt
          grep -q 'total=10000 dotted=6939 plain=3061 dotted_fraction=0.693900' risk-world-${{ matrix.archetype }}.txt

      - name: Sweep runtime-observable low-coverage risk policies
        run: |
          set -euo pipefail
          ./period_risk_certificate world.tsv | tee risk-${{ matrix.archetype }}.txt
          grep -q 'RISK_REF policy=cov8_s4' risk-${{ matrix.archetype }}.txt
          test "$(grep -c 'complete=1' risk-${{ matrix.archetype }}.txt)" -ge 12

      - name: Upload risk training result
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-period-risk-training-${{ matrix.archetype }}
          path: |
            research/tag-gremlin-v10/risk-world-${{ matrix.archetype }}.txt
            research/tag-gremlin-v10/risk-${{ matrix.archetype }}.txt
          if-no-files-found: error
