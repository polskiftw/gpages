name: Build Valheim Assembly Inspector

on:
  push:
    branches:
      - main
    paths:
      - 'valheim-assembly-inspector/**'
      - '.github/workflows/build-valheim-assembly-inspector.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BEPINEX_PACK_VERSION: '5.4.2350'
  ASSEMBLY_INSPECTOR_BUILD_RECIPE: 'net472-dotnet-build-v1'

concurrency:
  group: valheim-assembly-inspector-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compile references
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE 'valheim-assembly-inspector'
          $lib = Join-Path $project 'lib'
          New-Item -ItemType Directory -Force -Path $lib | Out-Null

          $bepUrl = "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/$env:BEPINEX_PACK_VERSION/"
          $bepZip = Join-Path $env:RUNNER_TEMP 'bepinex.zip'
          Invoke-WebRequest -Uri $bepUrl -OutFile $bepZip
          Expand-Archive -Path $bepZip -DestinationPath (Join-Path $env:RUNNER_TEMP 'bepinex')

          $bep = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'bepinex') -Recurse -File -Filter 'BepInEx.dll' | Select-Object -First 1
          $harmony = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'bepinex') -Recurse -File -Filter '0Harmony.dll' | Select-Object -First 1
          if (-not $bep) { throw 'Could not find BepInEx.dll' }
          if (-not $harmony) { throw 'Could not find 0Harmony.dll' }

          Copy-Item -Force $bep.FullName (Join-Path $lib 'BepInEx.dll')
          Copy-Item -Force $harmony.FullName (Join-Path $lib '0Harmony.dll')

          # Resolve the current private Valheim Managed snapshot by draft/asset name.
          $managedZip = Join-Path $env:RUNNER_TEMP 'ValheimDebug.tar.gz'
          $managedExtract = Join-Path $env:RUNNER_TEMP 'valheim-managed'
          $apiHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/polskiftw/gpages/releases?per_page=100' -Headers $apiHeaders
          $managedRelease = $releases |
            Where-Object { $_.draft -and $_.name -eq 'valheim managed binaries' } |
            Select-Object -First 1
          if (-not $managedRelease) { throw 'Could not find draft release "valheim managed binaries".' }

          $managedAsset = $managedRelease.assets |
            Where-Object { $_.name -eq 'ValheimDebug.tar.gz' } |
            Select-Object -First 1
          if (-not $managedAsset) { throw 'Draft release "valheim managed binaries" does not contain ValheimDebug.tar.gz.' }
          if (-not $managedAsset.digest -or -not $managedAsset.digest.StartsWith('sha256:')) {
            throw 'ValheimDebug.tar.gz does not expose a SHA-256 digest through the GitHub release API.'
          }

          $managedExpectedSha256 = $managedAsset.digest.Substring(7).ToLowerInvariant()
          $downloadHeaders = $apiHeaders.Clone()
          $downloadHeaders['Accept'] = 'application/octet-stream'
          Invoke-WebRequest -Uri $managedAsset.url -Headers $downloadHeaders -OutFile $managedZip

          $actual = (Get-FileHash $managedZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $managedExpectedSha256) {
            throw "ValheimDebug.tar.gz SHA256 mismatch. Expected $managedExpectedSha256, got $actual"
          }

          New-Item -ItemType Directory -Path $managedExtract -Force | Out-Null
          tar -xzf $managedZip -C $managedExtract
          $assemblyValheim = Get-ChildItem -Path $managedExtract -Recurse -File -Filter 'assembly_valheim.dll' | Select-Object -First 1
          if (-not $assemblyValheim) { throw 'Current Managed snapshot does not contain assembly_valheim.dll' }
          $managedDir = $assemblyValheim.Directory.FullName

          foreach ($required in @(
            'assembly_valheim.dll',
            'UnityEngine.dll',
            'UnityEngine.CoreModule.dll',
            'UnityEngine.IMGUIModule.dll',
            'UnityEngine.InputLegacyModule.dll'
          )) {
            $source = Join-Path $managedDir $required
            if (-not (Test-Path $source)) { throw "Current Managed snapshot is missing $required" }
          }

          foreach ($unityAssembly in @(
            'UnityEngine.dll',
            'UnityEngine.CoreModule.dll',
            'UnityEngine.IMGUIModule.dll',
            'UnityEngine.InputLegacyModule.dll'
          )) {
            Copy-Item -Force (Join-Path $managedDir $unityAssembly) (Join-Path $lib $unityAssembly)
          }

          Write-Host "Current assembly_valheim: $($assemblyValheim.FullName)"
          Write-Host "ValheimDebug.tar.gz SHA256: $actual"

      - name: Build Assembly Inspector
        shell: pwsh
        run: dotnet build .\valheim-assembly-inspector\AssemblyInspector.csproj -c Release

      - name: Verify output
        shell: pwsh
        run: |
          $dll = '.\valheim-assembly-inspector\bin\Release\net472\AssemblyInspector.dll'
          if (-not (Test-Path $dll)) { throw "Build output missing: $dll" }
          Get-FileHash $dll -Algorithm SHA256

      - name: Smoke-test live Harmony override
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $test = Join-Path $env:RUNNER_TEMP 'assembly-inspector-live-test'
          $out = Join-Path $test 'bin\Release\net8.0'
          New-Item -ItemType Directory -Force -Path $test | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <LangVersion>latest</LangVersion>
              <AssemblyName>AssemblyInspectorLiveSmokeTest</AssemblyName>
            </PropertyGroup>

          </Project>
          '@ | Set-Content -Path (Join-Path $test 'SmokeTest.csproj') -Encoding UTF8

          @'
          using System;
          using System.Collections;
          using System.IO;
          using System.Reflection;
          using System.Reflection.Emit;
          using System.Runtime.CompilerServices;

          internal static class Program
          {
              [MethodImpl(MethodImplOptions.NoInlining)]
              public static bool OriginalBool()
              {
                  return false;
              }

              public static bool EchoBool(bool value)
              {
                  return value;
              }

              private sealed class FieldCarrier
              {
                  public bool Flag = true;

                  public void Touch()
                  {
                  }
              }

              public static int Main()
              {
                  MethodInfo target = typeof(Program).GetMethod(
                      nameof(OriginalBool),
                      BindingFlags.Public | BindingFlags.Static);
                  MethodInfo argumentTarget = typeof(Program).GetMethod(
                      nameof(EchoBool),
                      BindingFlags.Public | BindingFlags.Static);
                  MethodInfo fieldTarget = typeof(FieldCarrier).GetMethod(
                      nameof(FieldCarrier.Touch),
                      BindingFlags.Public | BindingFlags.Instance);

                  Assembly plugin = Assembly.LoadFrom(
                      Path.Combine(AppDomain.CurrentDomain.BaseDirectory, "AssemblyInspector.dll"));
                  Type inspector = plugin.GetType(
                      "AssemblyInspectorMod.AssemblyInspector",
                      throwOnError: true);

                  MethodInfo factory = inspector.GetMethod(
                      "LivePostfixFactory",
                      BindingFlags.NonPublic | BindingFlags.Static);
                  FieldInfo overridesField = inspector.GetField(
                      "RuntimeOverrides",
                      BindingFlags.NonPublic | BindingFlags.Static);
                  FieldInfo argumentOverridesField = inspector.GetField(
                      "RuntimeArgumentOverrides",
                      BindingFlags.NonPublic | BindingFlags.Static);
                  FieldInfo fieldMutationsField = inspector.GetField(
                      "RuntimeFieldMutations",
                      BindingFlags.NonPublic | BindingFlags.Static);

                  if (factory == null || overridesField == null ||
                      argumentOverridesField == null || fieldMutationsField == null)
                  {
                      throw new Exception("Assembly Inspector live patch internals were not found.");
                  }

                  object overrides = overridesField.GetValue(null);
                  MethodInfo setter = overrides.GetType().GetMethod("set_Item");
                  setter.Invoke(overrides, new object[] { target, true });

                  ParameterInfo[] factoryParameters = factory.GetParameters();
                  if (!factory.IsStatic ||
                      factory.ReturnType != typeof(DynamicMethod) ||
                      factoryParameters.Length != 1 ||
                      factoryParameters[0].ParameterType != typeof(MethodBase))
                  {
                      throw new Exception("LivePostfixFactory no longer matches Harmony's patch-factory contract.");
                  }

                  DynamicMethod resolvedPostfix = (DynamicMethod)factory.Invoke(
                      null,
                      new object[] { target });

                  object[] postfixArgs = new object[] { target, false };
                  resolvedPostfix.Invoke(null, postfixArgs);

                  bool result = (bool)postfixArgs[1];
                  if (!result)
                      throw new Exception("Live override smoke test failed: dynamic postfix did not force false to true.");

                  IDictionary argumentOverrides = (IDictionary)argumentOverridesField.GetValue(null);
                  Type argumentMapType = argumentOverridesField.FieldType.GetGenericArguments()[1];
                  IDictionary argumentMap = (IDictionary)Activator.CreateInstance(argumentMapType);
                  argumentMap[0] = true;
                  argumentOverrides[argumentTarget] = argumentMap;

                  MethodInfo argumentPrefix = inspector.GetMethod(
                      "LiveArgumentAndFieldPrefix",
                      BindingFlags.NonPublic | BindingFlags.Static);
                  if (argumentPrefix == null)
                      throw new Exception("LiveArgumentAndFieldPrefix was not found.");

                  object[] liveArgs = new object[] { false };
                  argumentPrefix.Invoke(null, new object[] { argumentTarget, liveArgs });
                  if (!(bool)liveArgs[0])
                      throw new Exception("Live argument override smoke test failed.");

                  Type fieldPatchType = inspector.GetNestedType(
                      "FieldMutationPatch",
                      BindingFlags.NonPublic);
                  Type sourceKindType = inspector.GetNestedType(
                      "FieldMutationSourceKind",
                      BindingFlags.NonPublic);
                  if (fieldPatchType == null || sourceKindType == null)
                      throw new Exception("Field mutation patch metadata types were not found.");

                  object fieldPatch = Activator.CreateInstance(fieldPatchType, true);
                  fieldPatchType.GetField("Method").SetValue(fieldPatch, fieldTarget);
                  fieldPatchType.GetField("SourceKind").SetValue(
                      fieldPatch,
                      Enum.Parse(sourceKindType, "Instance"));
                  fieldPatchType.GetField("ArgumentIndex").SetValue(fieldPatch, -1);
                  fieldPatchType.GetField("Field").SetValue(
                      fieldPatch,
                      typeof(FieldCarrier).GetField(nameof(FieldCarrier.Flag)));
                  fieldPatchType.GetField("Value").SetValue(fieldPatch, false);
                  fieldPatchType.GetField("Postfix").SetValue(fieldPatch, false);
                  fieldPatchType.GetField("TargetPath").SetValue(fieldPatch, "this.Flag");

                  Type fieldListType = fieldMutationsField.FieldType.GetGenericArguments()[1];
                  IList fieldList = (IList)Activator.CreateInstance(fieldListType);
                  fieldList.Add(fieldPatch);
                  IDictionary fieldMutations = (IDictionary)fieldMutationsField.GetValue(null);
                  fieldMutations[fieldTarget] = fieldList;

                  MethodInfo instancePrefix = inspector.GetMethod(
                      "LiveInstanceFieldPrefix",
                      BindingFlags.NonPublic | BindingFlags.Static);
                  if (instancePrefix == null)
                      throw new Exception("LiveInstanceFieldPrefix was not found.");

                  FieldCarrier carrier = new FieldCarrier();
                  instancePrefix.Invoke(null, new object[] { fieldTarget, carrier });
                  if (carrier.Flag)
                      throw new Exception("Live field mutation smoke test failed.");

                  MethodInfo bundleGenerator = inspector.GetMethod(
                      "BuildGeneratedLiveBundle",
                      BindingFlags.NonPublic | BindingFlags.Static);
                  if (bundleGenerator == null)
                      throw new Exception("BuildGeneratedLiveBundle was not found.");

                  string bundleSource = (string)bundleGenerator.Invoke(null, null);
                  string bundleSourceAgain = (string)bundleGenerator.Invoke(null, null);

                  if (string.IsNullOrWhiteSpace(bundleSource) ||
                      !bundleSource.Contains("Postfix_0") ||
                      !bundleSource.Contains("__result = true;") ||
                      !bundleSource.Contains("PluginGuid = \"claire.valheim.generated.livebundle.") ||
                      !bundleSource.Contains("AssemblyInspectorLiveBundle_") ||
                      bundleSource.Contains("PluginGuid = \"claire.valheim.generated.livebundle\";"))
                  {
                      throw new Exception("Generated live bundle did not contain the expected unique identity and active bool override.");
                  }

                  if (!string.Equals(bundleSource, bundleSourceAgain, StringComparison.Ordinal))
                      throw new Exception("Identical live override sets did not generate a deterministic bundle identity.");

                  setter.Invoke(overrides, new object[] { target, false });
                  string changedBundleSource = (string)bundleGenerator.Invoke(null, null);

                  if (string.Equals(bundleSource, changedBundleSource, StringComparison.Ordinal) ||
                      !changedBundleSource.Contains("__result = false;"))
                  {
                      throw new Exception("Changing a live override did not change the generated bundle identity/source.");
                  }

                  setter.Invoke(overrides, new object[] { target, true });

                  MethodInfo argumentGenerator = inspector.GetMethod(
                      "BuildGeneratedArgumentMod",
                      BindingFlags.NonPublic | BindingFlags.Static);
                  MethodInfo fieldGenerator = inspector.GetMethod(
                      "BuildGeneratedFieldMutationMod",
                      BindingFlags.NonPublic | BindingFlags.Static);
                  if (argumentGenerator == null || fieldGenerator == null)
                      throw new Exception("Generated argument/field patch builders were not found.");

                  string argumentSource = (string)argumentGenerator.Invoke(
                      null,
                      new object[] { argumentTarget, 0, false });
                  string fieldSource = (string)fieldGenerator.Invoke(
                      null,
                      new object[] { fieldTarget, "this.Flag", false, false });

                  if (!argumentSource.Contains("__args[0] = false;") ||
                      !argumentSource.Contains("claire.valheim.generated.patch."))
                  {
                      throw new Exception("Generated argument override source was invalid.");
                  }

                  if (!fieldSource.Contains("SetField(__instance") ||
                      !fieldSource.Contains("\"Flag\"") ||
                      !fieldSource.Contains("claire.valheim.generated.patch."))
                  {
                      throw new Exception("Generated field mutation source was invalid.");
                  }

                  File.WriteAllText(
                      Path.Combine(AppDomain.CurrentDomain.BaseDirectory, "GeneratedLiveBundle.cs"),
                      bundleSource);
                  File.WriteAllText(
                      Path.Combine(AppDomain.CurrentDomain.BaseDirectory, "GeneratedArgumentPatch.cs"),
                      argumentSource);
                  File.WriteAllText(
                      Path.Combine(AppDomain.CurrentDomain.BaseDirectory, "GeneratedFieldPatch.cs"),
                      fieldSource);

                  Console.WriteLine("Live Harmony override smoke test passed.");
                  Console.WriteLine("Live argument override smoke test passed.");
                  Console.WriteLine("Live field mutation smoke test passed.");
                  Console.WriteLine("Generated live bundle source smoke test passed.");
                  Console.WriteLine("Generated argument/field patch source smoke test passed.");
                  return 0;
              }
          }
          '@ | Set-Content -Path (Join-Path $test 'Program.cs') -Encoding UTF8

          dotnet build (Join-Path $test 'SmokeTest.csproj') -c Release --nologo

          Copy-Item -Force '.\valheim-assembly-inspector\bin\Release\net472\AssemblyInspector.dll' $out
          Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'bepinex') -Recurse -File -Filter '*.dll' |
            ForEach-Object { Copy-Item -Force $_.FullName $out }
          Get-ChildItem -Path '.\valheim-assembly-inspector\lib' -File -Filter '*.dll' |
            ForEach-Object { Copy-Item -Force $_.FullName $out }

          dotnet (Join-Path $out 'AssemblyInspectorLiveSmokeTest.dll')
          if ($LASTEXITCODE -ne 0) {
            throw "Live Harmony override smoke test exited with code $LASTEXITCODE."
          }

          $generatedSource = Join-Path $out 'GeneratedLiveBundle.cs'
          $generatedArgumentSource = Join-Path $out 'GeneratedArgumentPatch.cs'
          $generatedFieldSource = Join-Path $out 'GeneratedFieldPatch.cs'
          foreach ($source in @($generatedSource, $generatedArgumentSource, $generatedFieldSource)) {
            if (-not (Test-Path $source)) {
              throw "Generated patch source was not produced by the smoke test: $source"
            }
          }

          $generatedProject = Join-Path $test 'generated-bundle'
          New-Item -ItemType Directory -Force -Path $generatedProject | Out-Null

          $refs = Get-ChildItem -Path '.\valheim-assembly-inspector\lib' -File -Filter '*.dll' |
            Sort-Object Name |
            ForEach-Object {
              $include = [System.Security.SecurityElement]::Escape([IO.Path]::GetFileNameWithoutExtension($_.Name))
              $hint = [System.Security.SecurityElement]::Escape($_.FullName)
              "    <Reference Include=`"$include`"><HintPath>$hint</HintPath><Private>false</Private></Reference>"
            }

          $generatedProjectFile = Join-Path $generatedProject 'GeneratedLiveBundle.csproj'
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net472</TargetFramework>
              <LangVersion>latest</LangVersion>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <AssemblyName>GeneratedLiveBundleSmokeTest</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="$generatedSource" />
              <Compile Include="$generatedArgumentSource" />
              <Compile Include="$generatedFieldSource" />
          $($refs -join [Environment]::NewLine)
            </ItemGroup>
          </Project>
          "@ | Set-Content -Path $generatedProjectFile -Encoding UTF8

          dotnet build $generatedProjectFile -c Release --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Generated live bundle source failed to compile with code $LASTEXITCODE."
          }

          Write-Host 'Generated live bundle compiled successfully.'

      - name: Publish Assembly Inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          New-Item -ItemType Directory -Force -Path '.\valheim\assembly-inspector' | Out-Null

          $builtDll = '.\valheim-assembly-inspector\bin\Release\net472\AssemblyInspector.dll'
          $hostedDll = '.\valheim\assembly-inspector\AssemblyInspector.dll'
          $pagePath = '.\valheim\assembly-inspector\index.html'
          $sourcePath = '.\valheim-assembly-inspector\AssemblyInspector.cs'
          $projectPath = '.\valheim-assembly-inspector\AssemblyInspector.csproj'

          # Use a stable build identity instead of rebuilt PE bytes. Some compiler/toolchain
          # details can perturb otherwise equivalent DLL bytes; those rebuilds must not
          # replace the hosted artifact or advance its timestamp.
          $sourceBlob = (git hash-object -- $sourcePath).Trim()
          $projectBlob = (git hash-object -- $projectPath).Trim()
          $identitySeed = @(
            $sourceBlob,
            $projectBlob,
            $env:VALHEIM_MANAGED_SHA256,
            $env:BEPINEX_PACK_VERSION,
            $env:ASSEMBLY_INSPECTOR_BUILD_RECIPE
          ) -join [char]10
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $identityBytes = [System.Text.Encoding]::UTF8.GetBytes($identitySeed)
            $buildId = ([BitConverter]::ToString($sha256.ComputeHash($identityBytes))).Replace('-', '').ToLowerInvariant()
          }
          finally {
            $sha256.Dispose()
          }

          $page = Get-Content -Raw $pagePath
          $buildIdPattern = '<time id="hosted-build" data-build-id="([^"]*)" datetime="[^"]*">.*?</time>'
          $hostedIdentityMatch = [regex]::Match($page, $buildIdPattern)
          if (-not $hostedIdentityMatch.Success) {
            throw "Could not find hosted-build identity/timestamp marker in $pagePath"
          }
          $hostedBuildId = $hostedIdentityMatch.Groups[1].Value
          $artifactChanged = $buildId -ne $hostedBuildId

          if ($artifactChanged) {
            Copy-Item -Force $builtDll $hostedDll

            $source = Get-Content -Raw $sourcePath
            $versionMatch = [regex]::Match($source, 'public const string PluginVersion = "([^"]+)";')
            if (-not $versionMatch.Success) {
              throw "Could not read PluginVersion from $sourcePath"
            }
            $pluginVersion = $versionMatch.Groups[1].Value

            $versionPattern = '<span class="plugin-version">[^<]*</span>'
            if (-not [regex]::IsMatch($page, $versionPattern)) {
              throw "Could not find plugin-version marker in $pagePath"
            }
            $page = [regex]::Replace(
              $page,
              $versionPattern,
              "<span class=`"plugin-version`">$pluginVersion</span>")

            $utcNow = [DateTimeOffset]::UtcNow
            $isoStamp = $utcNow.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
            $fallbackStamp = $utcNow.ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
            $timestampReplacement = "<time id=`"hosted-build`" data-build-id=`"$buildId`" datetime=`"$isoStamp`">$fallbackStamp</time>"
            $page = [regex]::Replace($page, $buildIdPattern, $timestampReplacement, 1)

            Set-Content -Path $pagePath -Value $page -Encoding utf8NoBOM
            $builtHash = (Get-FileHash $builtDll -Algorithm SHA256).Hash
            Write-Host "Publishing meaningful Assembly Inspector build ${buildId}: $builtHash (version $pluginVersion)"
          }
          else {
            Write-Host "Assembly Inspector build identity unchanged ($buildId); keeping the exact hosted DLL and timestamp."
          }


          git add -- 'valheim/assembly-inspector/AssemblyInspector.dll' 'valheim/assembly-inspector/index.html'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Published Assembly Inspector artifact is already current.'
            exit 0
          }

          git commit -m "Publish Assembly Inspector artifact"
          git push
