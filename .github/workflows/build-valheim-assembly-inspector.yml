name: Build Valheim Assembly Inspector

on:
  push:
    branches:
      - main
    paths:
      - 'valheim-assembly-inspector/**'
      - '.github/workflows/build-valheim-assembly-inspector.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valheim-assembly-inspector-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compile references
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE 'valheim-assembly-inspector'
          $lib = Join-Path $project 'lib'
          New-Item -ItemType Directory -Force -Path $lib | Out-Null

          $bepUrl = 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/'
          $bepZip = Join-Path $env:RUNNER_TEMP 'bepinex.zip'
          Invoke-WebRequest -Uri $bepUrl -OutFile $bepZip
          Expand-Archive -Path $bepZip -DestinationPath (Join-Path $env:RUNNER_TEMP 'bepinex')

          $bep = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'bepinex') -Recurse -File -Filter 'BepInEx.dll' | Select-Object -First 1
          $harmony = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'bepinex') -Recurse -File -Filter '0Harmony.dll' | Select-Object -First 1
          if (-not $bep) { throw 'Could not find BepInEx.dll' }
          if (-not $harmony) { throw 'Could not find 0Harmony.dll' }

          Copy-Item -Force $bep.FullName (Join-Path $lib 'BepInEx.dll')
          Copy-Item -Force $harmony.FullName (Join-Path $lib '0Harmony.dll')

          # Same pinned current Valheim Managed snapshot used by the other Valheim builds.
          $managedAssetId = 574482997
          $managedExpectedSha256 = 'b81c940eb8d1d751b3a5b12d1e9dbc9309fa508014e2d22c1a5065212c1234ed'
          $managedZip = Join-Path $env:RUNNER_TEMP 'valheim-managed.zip'
          $managedExtract = Join-Path $env:RUNNER_TEMP 'valheim-managed'
          $managedAssetUrl = "https://api.github.com/repos/polskiftw/gpages/releases/assets/$managedAssetId"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          Invoke-WebRequest -Uri $managedAssetUrl -Headers $headers -OutFile $managedZip
          $actual = (Get-FileHash $managedZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $managedExpectedSha256) {
            throw "Managed.zip SHA256 mismatch. Expected $managedExpectedSha256, got $actual"
          }

          Expand-Archive -Path $managedZip -DestinationPath $managedExtract
          $assemblyValheim = Get-ChildItem -Path $managedExtract -Recurse -File -Filter 'assembly_valheim.dll' | Select-Object -First 1
          if (-not $assemblyValheim) { throw 'Pinned Managed snapshot does not contain assembly_valheim.dll' }
          $managedDir = $assemblyValheim.Directory.FullName

          foreach ($required in @(
            'assembly_valheim.dll',
            'UnityEngine.dll',
            'UnityEngine.CoreModule.dll',
            'UnityEngine.IMGUIModule.dll',
            'UnityEngine.InputLegacyModule.dll'
          )) {
            $source = Join-Path $managedDir $required
            if (-not (Test-Path $source)) { throw "Pinned Managed snapshot is missing $required" }
          }

          foreach ($unityAssembly in @(
            'UnityEngine.dll',
            'UnityEngine.CoreModule.dll',
            'UnityEngine.IMGUIModule.dll',
            'UnityEngine.InputLegacyModule.dll'
          )) {
            Copy-Item -Force (Join-Path $managedDir $unityAssembly) (Join-Path $lib $unityAssembly)
          }

          Write-Host "Pinned assembly_valheim: $($assemblyValheim.FullName)"
          Write-Host "Managed.zip SHA256: $actual"

      - name: Build Assembly Inspector
        shell: pwsh
        run: dotnet build .\valheim-assembly-inspector\AssemblyInspector.csproj -c Release

      - name: Verify output
        shell: pwsh
        run: |
          $dll = '.\valheim-assembly-inspector\bin\Release\net472\AssemblyInspector.dll'
          if (-not (Test-Path $dll)) { throw "Build output missing: $dll" }
          Get-FileHash $dll -Algorithm SHA256

      - name: Smoke-test live Harmony override
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $test = Join-Path $env:RUNNER_TEMP 'assembly-inspector-live-test'
          $out = Join-Path $test 'bin\Release\net472'
          New-Item -ItemType Directory -Force -Path $test | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net472</TargetFramework>
              <OutputType>Exe</OutputType>
              <LangVersion>latest</LangVersion>
              <AssemblyName>AssemblyInspectorLiveSmokeTest</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="0Harmony">
                <HintPath>HARMONY_PATH</HintPath>
                <Private>true</Private>
              </Reference>
            </ItemGroup>
          </Project>
          '@.Replace('HARMONY_PATH', (Join-Path $env:GITHUB_WORKSPACE 'valheim-assembly-inspector\lib\0Harmony.dll')) |
            Set-Content -Path (Join-Path $test 'SmokeTest.csproj') -Encoding UTF8

          @'
          using HarmonyLib;
          using System;
          using System.IO;
          using System.Reflection;
          using System.Runtime.CompilerServices;

          internal static class Program
          {
              [MethodImpl(MethodImplOptions.NoInlining)]
              public static bool OriginalBool()
              {
                  return false;
              }

              public static int Main()
              {
                  MethodInfo target = typeof(Program).GetMethod(
                      nameof(OriginalBool),
                      BindingFlags.Public | BindingFlags.Static);

                  Assembly plugin = Assembly.LoadFrom(
                      Path.Combine(AppDomain.CurrentDomain.BaseDirectory, "AssemblyInspector.dll"));
                  Type inspector = plugin.GetType(
                      "AssemblyInspectorMod.AssemblyInspector",
                      throwOnError: true);

                  MethodInfo factory = inspector.GetMethod(
                      "LivePostfixFactory",
                      BindingFlags.NonPublic | BindingFlags.Static);
                  FieldInfo overridesField = inspector.GetField(
                      "RuntimeOverrides",
                      BindingFlags.NonPublic | BindingFlags.Static);

                  if (factory == null || overridesField == null)
                      throw new Exception("Assembly Inspector live override internals were not found.");

                  object overrides = overridesField.GetValue(null);
                  MethodInfo setter = overrides.GetType().GetMethod("set_Item");
                  setter.Invoke(overrides, new object[] { target, true });

                  Harmony harmony = new Harmony("claire.valheim.assemblyinspector.ci-live-test");
                  harmony.Patch(target, postfix: new HarmonyMethod(factory));

                  bool result = (bool)target.Invoke(null, null);
                  harmony.UnpatchSelf();

                  if (!result)
                      throw new Exception("Live override smoke test failed: false was not forced to true.");

                  Console.WriteLine("Live Harmony override smoke test passed.");
                  return 0;
              }
          }
          '@ | Set-Content -Path (Join-Path $test 'Program.cs') -Encoding UTF8

          dotnet build (Join-Path $test 'SmokeTest.csproj') -c Release --nologo

          Copy-Item -Force '.\valheim-assembly-inspector\bin\Release\net472\AssemblyInspector.dll' $out
          Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'bepinex') -Recurse -File -Filter '*.dll' |
            ForEach-Object { Copy-Item -Force $_.FullName $out }
          Get-ChildItem -Path '.\valheim-assembly-inspector\lib' -File -Filter '*.dll' |
            ForEach-Object { Copy-Item -Force $_.FullName $out }

          & (Join-Path $out 'AssemblyInspectorLiveSmokeTest.exe')
          if ($LASTEXITCODE -ne 0) {
            throw "Live Harmony override smoke test exited with code $LASTEXITCODE."
          }

      - name: Publish Assembly Inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          New-Item -ItemType Directory -Force -Path '.\valheim\assembly-inspector' | Out-Null
          Copy-Item -Force '.\valheim-assembly-inspector\bin\Release\net472\AssemblyInspector.dll' '.\valheim\assembly-inspector\AssemblyInspector.dll'

          git add -- 'valheim/assembly-inspector/AssemblyInspector.dll'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Published Assembly Inspector artifact is already current.'
            exit 0
          }

          git commit -m "Publish Assembly Inspector artifact"
          git push
