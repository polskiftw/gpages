name: Audit Valheim Cheat Tag Decomp

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-valheim-cheat-tags.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    steps:
      - name: Download latest Valheim debug draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          # Current refreshed private Valheim debug draft. This ID came from the
          # successful decompile workflow run that rebuilt the user's draft asset.
          $releaseId = 398304259
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -Headers $headers
          if (-not $release.draft) { throw 'Expected the Valheim debug release to remain a draft.' }

          $asset = $release.assets |
            Where-Object { $_.name -eq 'ValheimDebug.tar.gz' } |
            Select-Object -First 1
          if (-not $asset) { throw 'ValheimDebug.tar.gz not found in latest Valheim Debug draft.' }

          Write-Host "Using draft release $($release.id), asset $($asset.id), created $($release.created_at)"

          $downloadHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Uri $asset.url -Headers $downloadHeaders -OutFile ValheimDebug.tar.gz

          New-Item -ItemType Directory -Force -Path debug | Out-Null
          tar -xzf ValheimDebug.tar.gz -C debug
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract ValheimDebug.tar.gz.' }

          if (-not (Test-Path debug/Decomp)) { throw 'Debug bundle has no Decomp directory.' }

      - name: Extract cheat-tag source set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path audit | Out-Null

          $sourceFiles = Get-ChildItem debug/Decomp -Recurse -File -Filter '*.cs'
          $patterns = @(
            'm_cheated',
            'ItemCheated',
            's_cheated',
            's_cheatedQueued',
            'm_usedCheats',
            'bypassCheatChecks',
            'PlayerStatType.Cheats',
            'IncrementStat',
            'GetAllItems',
            'm_inventory'
          )

          $matched = @()
          foreach ($file in $sourceFiles) {
            $hit = Select-String -Path $file.FullName -Pattern $patterns -SimpleMatch -Quiet
            if ($hit) { $matched += $file }
          }

          $importantNames = @(
            'Inventory.cs',
            'ItemDrop.cs',
            'PlayerProfile.cs',
            'CharacterDrop.cs',
            'ZDO.cs',
            'ZDOVars.cs',
            'Terminal.cs',
            'Achievements.cs',
            'Player.cs',
            'Humanoid.cs',
            'Container.cs',
            'InventoryGui.cs',
            'Game.cs'
          )

          foreach ($name in $importantNames) {
            $matched += Get-ChildItem debug/Decomp -Recurse -File -Filter $name
          }

          $matched = $matched | Sort-Object FullName -Unique
          if ($matched.Count -eq 0) { throw 'No relevant decompiled source files found.' }

          $root = (Resolve-Path debug/Decomp).Path
          foreach ($file in $matched) {
            $relative = $file.FullName.Substring($root.Length).TrimStart('\','/')
            $dest = Join-Path audit $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
            Copy-Item -Force $file.FullName $dest
          }

          $matches = Select-String -Path $sourceFiles.FullName -Pattern $patterns -SimpleMatch
          $manifest = @(
            "Relevant source files: $($matched.Count)",
            "Pattern matches: $($matches.Count)",
            ''
          )
          $manifest += $matched | ForEach-Object {
            $_.FullName.Substring($root.Length).TrimStart('\','/')
          }
          $manifest += ''
          $manifest += '=== MATCHES ==='
          $manifest += $matches | ForEach-Object {
            $relative = $_.Path.Substring($root.Length).TrimStart('\','/')
            "$relative:$($_.LineNumber): $($_.Line.Trim())"
          }
          $manifest | Set-Content -Encoding UTF8 audit/manifest.txt

      - name: Upload audit sources
        uses: actions/upload-artifact@v4
        with:
          name: valheim-cheat-tag-audit
          path: audit
          if-no-files-found: error
          retention-days: 1
