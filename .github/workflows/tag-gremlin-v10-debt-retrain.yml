name: Tag Gremlin debt retraining under frozen certificates

# The training matrix was launched from PR run 32429856355.  Keep the retained
# workflow manual-only afterward; pull_request path filters apply to the whole PR
# diff and would otherwise retrain on every later research commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debt-training-10k:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archetype: balanced,   seed: 94001 }
          - { archetype: linguistic, seed: 94101 }
          - { archetype: names,      seed: 94201 }
          - { archetype: weird,      seed: 94301 }
          - { archetype: shortheavy, seed: 94401 }
          - { archetype: compound,   seed: 94501 }
    defaults:
      run:
        working-directory: research/tag-gremlin-v10
    steps:
      - uses: actions/checkout@v4

      - name: Build grammar-corrected period-only simulator
        run: python3 period_only_sim.py --src native_sim.cpp --out native_sim_period_only.cpp

      - name: Compile debt retraining harness
        run: g++ -O3 -std=c++20 -march=x86-64-v3 period_debt_retrain.cpp -o period_debt_retrain

      - name: Generate exact-prevalence 10k training world
        run: |
          set -euo pipefail
          python3 period_quota_worldgen.py \
            --target-total 10000 \
            --target-dotted 6939 \
            --seed-base ${{ matrix.seed }} \
            --archetype ${{ matrix.archetype }} \
            --shard-n 10000 \
            --max-shards 80 \
            --out world.tsv | tee debt-world-${{ matrix.archetype }}.txt
          grep -q 'total=10000 dotted=6939 plain=3061 dotted_fraction=0.693900' debt-world-${{ matrix.archetype }}.txt

      - name: Sweep debt hysteresis with cov8_s4 frozen
        run: |
          set -euo pipefail
          ./period_debt_retrain world.tsv | tee debt-${{ matrix.archetype }}.txt
          grep -q 'DEBT_BASE' debt-${{ matrix.archetype }}.txt
          test "$(grep -c 'complete=1' debt-${{ matrix.archetype }}.txt)" -ge 25

      - name: Upload debt training result
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-period-debt-training-${{ matrix.archetype }}
          path: |
            research/tag-gremlin-v10/debt-world-${{ matrix.archetype }}.txt
            research/tag-gremlin-v10/debt-${{ matrix.archetype }}.txt
          if-no-files-found: error
