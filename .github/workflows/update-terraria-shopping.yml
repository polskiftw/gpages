name: Update Terraria shopping data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
  push:
    branches:
      - main
      - terraria-full-catalog
    paths:
      - 'terraria-shopping/scripts/build_data.py'
      - 'terraria-shopping/scripts/repair_recipe_revisions.py'
      - 'terraria-shopping/scripts/recipe_revision_rules.py'
      - 'terraria-shopping/scripts/build_availability.py'
      - 'terraria-shopping/scripts/repair_availability.py'
      - 'terraria-shopping/scripts/apply_source_priorities.py'
      - 'terraria-shopping/scripts/build_fishing.py'
      - 'terraria-shopping/scripts/build_vendors.py'
      - 'terraria-shopping/scripts/audit_data.py'
      - 'terraria-shopping/scripts/audit_current_data.py'
      - 'terraria-shopping/scripts/audit_platform_overrides.py'
      - 'terraria-shopping/scripts/audit_curated_projects.py'
      - 'terraria-shopping/scripts/audit_source_quality.py'
      - 'terraria-shopping/enrichment-projects.js'
      - 'terraria-shopping/enrichment-items-*.js'
      - '.github/workflows/update-terraria-shopping.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build recipe graph
        run: python terraria-shopping/scripts/build_data.py
      - name: Resolve Desktop recipe revisions
        run: python terraria-shopping/scripts/repair_recipe_revisions.py
      - name: Build availability badges
        run: python terraria-shopping/scripts/build_availability.py
      - name: Repair acquisition source badges
        run: python terraria-shopping/scripts/repair_availability.py
      - name: Apply direct acquisition source priorities
        run: python terraria-shopping/scripts/apply_source_priorities.py
      - name: Audit acquisition source priority
        run: python terraria-shopping/scripts/audit_source_quality.py
      - name: Build fishing routes
        run: python terraria-shopping/scripts/build_fishing.py
      - name: Build vendor prices
        run: python terraria-shopping/scripts/build_vendors.py
      - name: Audit all resolved recipes and shopping lists
        run: python terraria-shopping/scripts/audit_current_data.py
      - name: Audit platform override resolution
        run: python terraria-shopping/scripts/audit_platform_overrides.py
      - name: Audit curated project shopping lists
        run: python terraria-shopping/scripts/audit_curated_projects.py
      - name: Commit generated data when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- terraria-shopping/data.generated.js terraria-shopping/availability.generated.js terraria-shopping/fishing.generated.js terraria-shopping/vendors.generated.js)" ]; then
            echo "Terraria data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terraria-shopping/data.generated.js terraria-shopping/availability.generated.js terraria-shopping/fishing.generated.js terraria-shopping/vendors.generated.js
          git commit -m "Update Terraria shopping data"
          git push