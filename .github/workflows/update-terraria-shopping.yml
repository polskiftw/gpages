name: Update Terraria shopping data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
  push:
    branches:
      - main
      - terraria-full-catalog
      - terraria-availability-badges
    paths:
      - 'terraria-shopping/scripts/build_data.py'
      - 'terraria-shopping/scripts/build_availability.py'
      - '.github/workflows/update-terraria-shopping.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build recipe graph
        run: python terraria-shopping/scripts/build_data.py
      - name: Build availability badges
        run: python terraria-shopping/scripts/build_availability.py
      - name: Commit generated data when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- terraria-shopping/data.generated.js terraria-shopping/availability.generated.js)" ]; then
            echo "Terraria data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terraria-shopping/data.generated.js terraria-shopping/availability.generated.js
          git commit -m "Update Terraria shopping data"
          git push

# branch validation trigger
