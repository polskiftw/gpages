name: Validate static JavaScript

on:
  push:
    paths:
      - 'terraria-shopping/**'
      - '.github/workflows/validate-static-js.yml'
  pull_request:
    paths:
      - 'terraria-shopping/**'
      - '.github/workflows/validate-static-js.yml'

jobs:
  terraria-shopping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "Checking $file"
            node --check "$file"
          done < <(find terraria-shopping -type f -name '*.js' -print0 | sort -z)
          if [ "$found" -eq 0 ]; then
            echo "No JavaScript files found."
            exit 1
          fi
          echo "Static JavaScript syntax looks good."
